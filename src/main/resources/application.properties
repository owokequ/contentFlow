spring.application.name=contentflow

# Читаем .env из рабочей директории приложения
spring.config.import=optional:file:./.env[.properties]

# HTTP-порт приложения
server.port=${APP_PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate проверяет схему, но не создаёт её
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Миграциями управляет Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RSA PEM: PKCS#8 private key and X.509 public key, stored outside Git.
identity.tokens.private-key=${JWT_PRIVATE_KEY:file:./secrets/jwt-private.pem}
identity.tokens.public-key=${JWT_PUBLIC_KEY:file:./secrets/jwt-public.pem}
identity.tokens.issuer=${JWT_ISSUER:contentflow}
identity.tokens.audience=${JWT_AUDIENCE:contentflow-api}
identity.tokens.access-ttl=15m
identity.tokens.session-ttl=30d
identity.tokens.cookie-secure=${AUTH_COOKIE_SECURE:true}
identity.tokens.allowed-origins=${FRONTEND_ORIGINS:}
